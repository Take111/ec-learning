# フェーズD: CI。ローカルと同じ入口(mise タスク)を CI でも通す —
# 「操作の入口はすべて mise タスク」(CLAUDE.md)を CI にも適用する。
# ツールのバージョンは mise.toml が唯一の情報源(CIで別途宣言しない)。
name: CI

# GITHUB_TOKEN は read-only に固定(リポジトリ設定に依存させない)。
# サードパーティ action は SHA ピンで参照する(ADR 007)。ピンの付与と更新は Renovate
# (helpers:pinGitHubActionDigests)が PR で行うので、人がハッシュを追いかける運用コストはない。
# 導入前は「露出シークレットが read-only の GITHUB_TOKEN のみで実害余地が小さい」としてタグ参照を
# 許容していたが、保守コストがゼロになったので切り替えた(Renovate の初回 PR がマージされるまではタグ参照のまま)
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  # ネイティブビルドを任意のブランチで手動実行するため(Actions タブの Run workflow)
  workflow_dispatch:

# 同じ PR への連続 push では古い実行を打ち切る(macOS のネイティブビルドが 20〜30 分かかるため)。
# PR 以外は run_id でグループを一意にし、main の連続 push が互いを打ち切らないようにする
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  api:
    name: API(lint / migration / test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      # マイグレーション検証: 素の PostgreSQL 18 に 001 から全連番を適用できることが
      # このジョブの検証項目のひとつ(ローカルは適用済みDBなので順序バグはCIでしか出ない)
      - name: PostgreSQL 起動(docker compose — ローカルと同一構成)
        run: mise run up
      - name: マイグレーション全適用
        run: mise run migrate

      # sqlc の生成物がコミット済みのものと一致するか(SQL と Go の乖離検知)
      - name: sqlc 生成物の乖離チェック
        run: |
          mise run sqlc
          git diff --exit-code -- api/internal/db

      - name: lint(golangci-lint)
        working-directory: api
        run: mise exec -- golangci-lint run ./...

      # place_test.go は実DBへの並行攻撃テスト(在庫マイナス不発生・冪等性の実証)。
      # フィクスチャは自己完結(カテゴリも自前で作る)なので seed 投入は不要
      - name: test(実DB・並行テスト込み)
        run: mise run api-test

  mobile:
    name: mobile(typecheck / lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: 依存インストール(pnpm はCIでは自動で frozen-lockfile)
        run: mise run mobile-install
      - name: tsc + expo lint
        run: mise run mobile-check

      # Expo SDK 連動パッケージのガード(ADR 007)。Renovate は Expo SDK の互換表を知らないので、
      # SDK 連動の更新 PR(ブランチ renovate/expo-sdk = renovate.json5 の groupSlug)に限って
      # 「SDK がいま期待する版か」を expo install --check で検証し、ずれた版が混ざれば赤くする。
      # 全 PR で走らせない理由: このチェックは Expo 側のパッチ公開のたびに古くなるため、
      # 無関係な PR や main まで赤くなる(SDK ラインを手で動かすときはローカルで同じタスクを回す)。
      # exact ピン(react-native / react / reanimated …)は Expo が版を決めるため Renovate の対象外。
      # その期待が動いたときもこの PR は赤くなる → `npx expo install --fix` を足してからマージする
      - name: Expo SDK 互換チェック(Renovate の expo-sdk PR のみ)
        if: startsWith(github.head_ref, 'renovate/expo-sdk')
        run: mise run mobile-expo-check

  # mobile/ が変わったときだけネイティブビルドを回す(API だけの PR で macOS を 20〜30 分回さない)
  changes:
    name: 変更範囲の判定
    runs-on: ubuntu-latest
    outputs:
      # フィルタが skip されたとき(workflow_dispatch)は空文字 → 実行する
      mobile: ${{ steps.filter.outputs.mobile != 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # workflow_dispatch は比較対象のコミットが無いので判定を飛ばす
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        if: github.event_name != 'workflow_dispatch'
        id: filter
        with:
          filters: |
            mobile:
              - 'mobile/**'
              - 'mise.toml'
              - '.github/workflows/ci.yml'

  mobile-ios:
    name: mobile(iOS ネイティブビルド)
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    # macos-26 = Xcode 26(Liquid Glass に必要な iOS 26 SDK)。latest にすると Xcode 27 へ勝手に動くので固定
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: 依存インストール
        run: mise run mobile-install
      - name: prebuild + xcodebuild(シミュレータ・署名なし・バンドルなし)
        run: mise run mobile-ios-build

  mobile-android:
    name: mobile(Android ネイティブビルド)
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    # ubuntu ランナーは Android SDK / NDK / JDK 17(既定)を同梱しているので、セットアップ用 action は不要
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: 依存インストール
        run: mise run mobile-install
      - name: prebuild + gradle assembleDebug(x86_64 のみ)
        run: mise run mobile-android-build

  # Branch protection の Required はこのジョブ 1 つだけにする(個別ジョブは Required にしない)。
  # 理由: ネイティブビルドは paths-filter で skip されることがあり、skip されたジョブを Required にすると
  # 「チェックが永遠に来ない」状態でマージが止まる。逆に Required から外すと、走っている最中でも
  # 「Required は全部緑」と見なされ auto-merge が待ってくれない。両立させるには、全ジョブの結果を
  # 1 箇所に集約して「skip は合格・failure/cancelled は不合格」と読み替える層が要る。
  # ジョブを増減しても Branch 設定を触らなくてよい、という副次効果もある。
  # 前提: この名前(ci-ok)で Required に登録している。名前を変えたら Settings → Branches も直す
  ci-ok:
    name: ci-ok
    needs: [api, mobile, changes, mobile-ios, mobile-android]
    # 上流が失敗・skip でも必ず走らせる(既定だと needs の 1 つでも skip されると自分も skip され、
    # Required が pending のまま固まる)。always() でなく !cancelled() なのは、concurrency の
    # cancel-in-progress で古い run が打ち切られたときまで赤くしないため(新しいコミットには新しい run が付く)
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: 上流ジョブの結果
        run: echo '${{ toJSON(needs) }}'
      # changes も needs に含める理由: 判定ジョブが失敗するとネイティブビルドは「needs 失敗 → skipped」になり、
      # skipped は合格扱いなので、changes 自身を見ていないと赤いはずの PR が緑になる
      - name: 失敗・打ち切りがあれば落とす(skipped は合格)
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
