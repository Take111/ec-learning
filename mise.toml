# プロジェクトの唯一の入口: ツールバージョン + 環境変数 + タスク
# フェーズB で go を追加予定(global の 1.25.12 に依存せずここで固定する)

[tools]
node = "24" # faker / tsx / Expo 用。システムの v18 に依存しない
pnpm = "10" # フェーズC(mobile)のパッケージマネージャ。グローバルの pnpm に依存せず固定
go = "1.27" # フェーズB(API)用。global の go に依存せずプロジェクトで固定
golangci-lint = "2" # フェーズD(CI)用。CIとローカルで同じバージョンを使う
sqlc = "1.31.1" # 生成物をコミットする性質上、版が動くとCIの乖離チェックが誤爆する — 厳密固定

[env]
# タスク内シェルの PATH では /usr/local/bin/node (v18) が mise の node に勝つ。
# mise exec は直接呼ぶコマンド(node等)しか差し替えず、pnpm/npx が spawn する子プロセスは
# PATH 解決で v18 に落ちる。そのため node を使うタスクは PATH="$EC_TOOL_PATH:$PATH" を前置する。
# ([env] の PATH や _.path での前置は、このマシンの mise 2026.7.7 では効かないことを確認済み)
# shims を指すことで [tools] のバージョン変更に自動追従する(バージョンをパスに複製しない)
EC_TOOL_PATH = "{{env.HOME}}/.local/share/mise/shims"

# ローカル学習用の固定値。このリポジトリは公開前提なので、あえて平文で置く
# (本番運用の構成例ではない、という意図を明示するため。秘匿が必要になったら .env + gitignore に移す)
PGHOST = "localhost"
PGPORT = "5432"
PGUSER = "ec"
PGPASSWORD = "ec"
PGDATABASE = "ec"

# ---- タスク ----

[tasks.explain]
description = "db/queries/<name>.sql を EXPLAIN ANALYZE して docs/measurements/ に保存(例: mise run explain -- q1 baseline)"
run = "scripts/explain.sh"

[tasks.load]
description = "data/のCSVを投入(\\copy → setval → ANALYZE前後のEXPLAIN保存 → 検証)"
run = "scripts/load.sh"

[tasks.seed]
description = "8テーブル分のCSVを data/ に生成(シード固定・再現可能)"
dir = "tools/seed"
run = [
  'PATH="$EC_TOOL_PATH:$PATH" npm install --no-audit --no-fund --loglevel=error',
  'PATH="$EC_TOOL_PATH:$PATH" npm run --silent seed',
]

[tasks.migrate]
description = "未適用の連番マイグレーションを順に適用"
run = "scripts/migrate.sh"

[tasks.schema-dump]
description = "適用済みスキーマを db/schema.sql に書き出す(schema.sql は生成物)"
run = "docker compose exec -T db pg_dump -U ec -d ec --schema-only --no-owner --exclude-table=schema_migrations > db/schema.sql"

[tasks.up]
description = "PostgreSQL を起動してヘルスチェック完了まで待つ"
run = "docker compose up -d --wait"

[tasks.down]
description = "PostgreSQL を停止(データ volume は残る)"
run = "docker compose down"

[tasks.reset]
description = "データ volume ごと破棄して作り直す(計測のやり直し用)"
run = "docker compose down -v && docker compose up -d --wait"

[tasks.psql]
description = "コンテナ内の psql に入る(引数はそのまま psql へ渡る: mise run psql -- -c 'select 1')"
run = "docker compose exec db psql -U ec -d ec"

[tasks.api-run]
description = "APIサーバーを起動(:8080)"
dir = "api"
run = "mise exec -- go run ./cmd/api"

[tasks.sqlc]
description = "SQLから型付きGoコードを生成(api/internal/db/)"
dir = "api"
run = "mise exec -- sqlc generate"

[tasks.api-test]
description = "APIの統合テスト(実DBが必要: mise run up 済みであること)"
dir = "api"
run = "mise exec -- go test ./... -count=1 -v"

[tasks.mobile-install]
description = "mobile/ の依存をインストール(pnpm)"
dir = "mobile"
run = 'PATH="$EC_TOOL_PATH:$PATH" pnpm install'

[tasks.mobile-start]
description = "Expo 開発サーバーを起動(引数はそのまま expo start へ: mise run mobile-start -- --web)"
dir = "mobile"
run = 'PATH="$EC_TOOL_PATH:$PATH" pnpm start'

[tasks.mobile-prebuild]
description = "ネイティブプロジェクトを生成(CNG: ios/android は生成物で git 管理外)"
dir = "mobile"
run = 'PATH="$EC_TOOL_PATH:$PATH" pnpm run prebuild'

[tasks.mobile-ios]
description = "iOS をローカルビルドしてシミュレータで起動(development build。追加引数は expo run:ios へ: mise run mobile-ios -- --no-bundler)"
dir = "mobile"
# --device を固定する理由: 無指定だと「今 Booted のシミュレータ > Simulator.app の既定端末」の順で選ばれ、
# 別プロジェクトで iOS 18 以下の端末を開いていると Liquid Glass(iOS 26+)が出ないビルドがそこに入る。
# 端末名は環境変数で差し替え可(例: EC_IOS_DEVICE="iPhone 17" mise run mobile-ios)。
# 同名端末が複数ランタイムにある場合、expo は Booted 中のものを優先し、なければ simctl の並び順で最初のもの。
# 前提: ios/ が無ければ expo run:ios が prebuild を自動実行する(--clean はしないので、config 変更後は mobile-prebuild を先に)
# 前提: 起動は「exp+<app.json の slug>://expo-development-client/?url=<Metro>」のディープリンクで行われる
# (expo-dev-client/plugin の getDefaultScheme が slug から生成)。slug が他プロジェクトと同じだと LaunchServices が
# 別アプリ(例: workout-log の slug "mobile")にリンクを渡し、そのアプリが本プロジェクトの JS バンドルを読んで
# worklets の JS/ネイティブ不一致で SIGABRT する(2026-08-28 に実際に発生)。bundle id は別でも防げない。
# → slug と scheme を "eclearning" に固定。create-expo-app 既定の "mobile" に戻さないこと。
# 前提: 実機ビルド・Watch ターゲットに必要な Apple Team ID は mobile/.env.local の EC_APPLE_TEAM_ID から
# app.config.ts が注入する(Expo CLI が .env.local を自動で読むので mise の [env] には置かない)。
run = 'PATH="$EC_TOOL_PATH:$PATH" pnpm exec expo run:ios --device "${EC_IOS_DEVICE:-iPhone 17 Pro}"'

[tasks.mobile-watch]
description = "Watch アプリをビルドして、ペアリング済みの Watch シミュレータにインストール・起動(EC_WATCH_UDID で端末指定可)"
dir = "mobile"
# 前提: Watch アプリ(targets/watch/、@bacons/apple-targets が prebuild で注入)は iOS アプリに埋め込まれるが、
# expo run:ios は iPhone 側にしか入れない。Watch シミュレータには watch.app を個別に install する必要がある。
# ビルド先を ios/build/watch に固定するのは、expo run:ios が使う DerivedData のパスがハッシュ付きで不定なため。
# -scheme watch ではなく -project/-target watch で単体ビルドする理由: workspace の自動生成スキームは Pods の
# ExpoModulesJSI 等まで watchsimulator 向けにビルドしようとして失敗する(実測)。watch ターゲットは依存ゼロ。
# 前提: 「Booted な iPhone と Booted な Watch のペア(active)」が1組必要。無ければ手順を出して止まる。
#   作り方: xcrun simctl pair <watch udid> <phone udid> → xcrun simctl boot <watch udid>
# 前提: Watch 側は http://localhost:8080 の Go API を直接叩く(ADR 008)。mise run api-run が先。
run = '''
set -e
if [ ! -e ios/mobile.xcworkspace ]; then echo "ios/ が無いので prebuild します"; PATH="$EC_TOOL_PATH:$PATH" pnpm run prebuild; fi
WATCH="${EC_WATCH_UDID:-$(xcrun simctl list pairs -j | jq -r '.pairs[] | select(.state|startswith("(active")) | select(.watch.state=="Booted" and .phone.state=="Booted") | .watch.udid' | head -1)}"
if [ -z "$WATCH" ]; then
  echo "Booted な iPhone/Watch のペアが見つかりません。xcrun simctl list pairs で確認し、"
  echo "  xcrun simctl pair <watch udid> <phone udid> && xcrun simctl boot <watch udid>"
  echo "でペアを作ってから再実行してください(EC_WATCH_UDID で直接指定も可)"; exit 1
fi
echo "▸ watch ターゲットを単体ビルド(watchsimulator → ios/build/watch)"
LOG=ios/build/watch-build.log; mkdir -p ios/build
xcodebuild -project ios/mobile.xcodeproj -target watch -configuration Debug -sdk watchsimulator SYMROOT="$PWD/ios/build/watch" build > "$LOG" 2>&1 \
  || { echo "ビルド失敗。エラー行:"; grep -E "error:" "$LOG" | sort -u | head -20; echo "(全文: mobile/$LOG)"; exit 1; }
APP=ios/build/watch/Debug-watchsimulator/watch.app
BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist")
echo "▸ install → $WATCH ($BUNDLE_ID)"
xcrun simctl install "$WATCH" "$APP"
xcrun simctl launch "$WATCH" "$BUNDLE_ID"
'''

[tasks.mobile-xcode]
description = "Xcode で mobile/ios/mobile.xcworkspace を開く(.xcodeproj を直接開くと Pods が入らずビルドが失敗する)"
dir = "mobile"
# 前提: CocoaPods 構成では Pods は .xcworkspace 側にしか含まれない。.xcodeproj を開いてビルドすると
# 「module map file …/Expo.modulemap not found」→「No such module 'Expo'」で必ず失敗する(2026-08-28 に実際に発生)。
# Finder / GitHub Desktop から開くと .xcodeproj を選びがちなので、入口をこのタスクに固定する。
# ios/ は生成物(CNG)。無ければ prebuild してから開く。Xcode 上の手変更は次の prebuild で消える点に注意
run = '''
set -e
if [ ! -e ios/mobile.xcworkspace ]; then
  echo "ios/ が無いので prebuild します"
  PATH="$EC_TOOL_PATH:$PATH" pnpm run prebuild
fi
xed ios/mobile.xcworkspace
'''

[tasks.mobile-ios-build]
description = "iOS をシミュレータ向けにビルドだけ行う(署名なし・JS バンドルなし。CI のネイティブビルド検証と同じ手順)"
dir = "mobile"
# 目的は「ネイティブ側(prebuild → CocoaPods → Xcode)が通るか」の検証。JS 側は tsc / lint(mobile-check)が担うので
# SKIP_BUNDLING=1 で Metro のバンドル工程を飛ばす(react-native-xcode.sh がこの変数を見る)。
# 前提: シミュレータ向け Debug は署名不要。CODE_SIGNING_ALLOWED=NO を明示して Team ID(EC_APPLE_TEAM_ID)無しでも通す
#   (@bacons/apple-targets が「appleTeamId が無い」と警告を出すが、シミュレータビルドには影響しない)。
# 前提: -destination generic では全 arch がビルドされるので、ARCHS をホスト CPU(uname -m: arm64 / x86_64)に固定する。
# 前提: Watch ターゲット(targets/watch)は本体 scheme の依存として一緒にコンパイルされる → Swift の破損もここで検知できる。
# derivedDataPath を ios/build/ci に固定するのは、既定の ~/Library/Developer/Xcode/DerivedData がハッシュ付きで不定なため
# (mobile-watch と同じ理由)。ログはファイルに落とし、失敗時に error 行を抜き出す(xcodebuild の全文は数万行になる)。
# CI(GitHub Actions は CI=true を設定する)では error 行に原因が出ない失敗(Pods の解決・リンク)に備えて末尾も出す
run = '''
set -e
ARCH="$(uname -m)"
echo "▸ prebuild(ios)"
PATH="$EC_TOOL_PATH:$PATH" CI=1 pnpm run prebuild --platform ios
echo "▸ xcodebuild(iOS Simulator / Debug / $ARCH → ios/build/ci)"
LOG=ios/build/ci-build.log; mkdir -p ios/build
xcodebuild -workspace ios/mobile.xcworkspace -scheme mobile -configuration Debug \
  -destination 'generic/platform=iOS Simulator' -derivedDataPath ios/build/ci \
  CODE_SIGNING_ALLOWED=NO SKIP_BUNDLING=1 ARCHS="$ARCH" \
  build > "$LOG" 2>&1 \
  || { echo "ビルド失敗。エラー行:"; grep -E "error:" "$LOG" | sort -u | head -30; echo "(全文: mobile/$LOG)";
       if [ -n "${CI:-}" ]; then echo "--- ログ末尾 ---"; tail -n 300 "$LOG"; fi; exit 1; }
echo "✔ iOS ビルド成功"
'''

[tasks.mobile-android-build]
description = "Android を Debug ビルドだけ行う(APK は起動しない。CI のネイティブビルド検証と同じ手順。前提: JDK 17 と Android SDK)"
dir = "mobile"
# 目的は iOS 側と同じ「ネイティブが通るか」。Debug variant は JS を Metro から読む設計なのでバンドル工程は元から無い。
# 前提: ABI を x86_64 に絞る(gradle.properties の既定は 4 ABI)。reanimated / worklets の C++ を NDK で ABI ごとに
#   コンパイルするのがビルド時間の大半で、「通るか」の検証に複数 ABI は要らない。実機向け APK が要るなら外す。
# 前提: JDK は RN 0.86 の gradle-plugin が 17 に揃える(JdkConfiguratorUtils)。Gradle 9 系の最低要件も 17。
#   GitHub の ubuntu ランナーは既定が 17 なので CI 側で追加セットアップはしていない(既定が動いたら setup-java を足す)。
# --no-daemon: 1 回きりのビルドでデーモンを残さない(CI 向け。ローカルで繰り返すなら外して構わない)
run = '''
set -e
echo "▸ prebuild(android)"
PATH="$EC_TOOL_PATH:$PATH" CI=1 pnpm run prebuild --platform android
echo "▸ gradle assembleDebug(ABI: x86_64 のみ)"
cd android && PATH="$EC_TOOL_PATH:$PATH" ./gradlew assembleDebug --no-daemon -PreactNativeArchitectures=x86_64
echo "✔ Android ビルド成功"
'''

[tasks.mobile-check]
description = "mobile/ の型チェックと lint"
dir = "mobile"
run = 'PATH="$EC_TOOL_PATH:$PATH" pnpm run check'

[tasks.mobile-expo-check]
description = "mobile/ の依存が Expo SDK の期待する版か検証(SDK 連動の更新 PR で CI が走らせる。ずれていたら npx expo install --fix)"
dir = "mobile"
run = 'PATH="$EC_TOOL_PATH:$PATH" CI=1 pnpm exec expo install --check'

[tasks.renovate-dry-run]
description = "Renovate をローカルで dry-run し、検知した依存と提案を表で出す(PR は作らない。renovate.json5 を変えたらまずこれ)"
run = "scripts/renovate-dry-run.sh"
