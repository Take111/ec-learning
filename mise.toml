# プロジェクトの唯一の入口: ツールバージョン + 環境変数 + タスク
# フェーズB で go を追加予定(global の 1.25.12 に依存せずここで固定する)

[tools]
node = "22" # faker / tsx / Expo 用。システムの v18 に依存しない
pnpm = "10" # フェーズC(mobile)のパッケージマネージャ。グローバルの pnpm に依存せず固定
go = "1.25" # フェーズB(API)用。global の go に依存せずプロジェクトで固定
golangci-lint = "2" # フェーズD(CI)用。CIとローカルで同じバージョンを使う
sqlc = "1.31.1" # 生成物をコミットする性質上、版が動くとCIの乖離チェックが誤爆する — 厳密固定

[env]
# タスク内シェルの PATH では /usr/local/bin/node (v18) が mise の node に勝つ。
# mise exec は直接呼ぶコマンド(node等)しか差し替えず、pnpm/npx が spawn する子プロセスは
# PATH 解決で v18 に落ちる。そのため node を使うタスクは PATH="$EC_TOOL_PATH:$PATH" を前置する。
# ([env] の PATH や _.path での前置は、このマシンの mise 2026.7.7 では効かないことを確認済み)
# shims を指すことで [tools] のバージョン変更に自動追従する(バージョンをパスに複製しない)
EC_TOOL_PATH = "{{env.HOME}}/.local/share/mise/shims"

# ローカル学習用の固定値。このリポジトリは公開前提なので、あえて平文で置く
# (本番運用の構成例ではない、という意図を明示するため。秘匿が必要になったら .env + gitignore に移す)
PGHOST = "localhost"
PGPORT = "5432"
PGUSER = "ec"
PGPASSWORD = "ec"
PGDATABASE = "ec"

# ---- タスク ----

[tasks.explain]
description = "db/queries/<name>.sql を EXPLAIN ANALYZE して docs/measurements/ に保存(例: mise run explain -- q1 baseline)"
run = "scripts/explain.sh"

[tasks.load]
description = "data/のCSVを投入(\\copy → setval → ANALYZE前後のEXPLAIN保存 → 検証)"
run = "scripts/load.sh"

[tasks.seed]
description = "8テーブル分のCSVを data/ に生成(シード固定・再現可能)"
dir = "tools/seed"
run = [
  'PATH="$EC_TOOL_PATH:$PATH" npm install --no-audit --no-fund --loglevel=error',
  'PATH="$EC_TOOL_PATH:$PATH" npm run --silent seed',
]

[tasks.migrate]
description = "未適用の連番マイグレーションを順に適用"
run = "scripts/migrate.sh"

[tasks.schema-dump]
description = "適用済みスキーマを db/schema.sql に書き出す(schema.sql は生成物)"
run = "docker compose exec -T db pg_dump -U ec -d ec --schema-only --no-owner --exclude-table=schema_migrations > db/schema.sql"

[tasks.up]
description = "PostgreSQL を起動してヘルスチェック完了まで待つ"
run = "docker compose up -d --wait"

[tasks.down]
description = "PostgreSQL を停止(データ volume は残る)"
run = "docker compose down"

[tasks.reset]
description = "データ volume ごと破棄して作り直す(計測のやり直し用)"
run = "docker compose down -v && docker compose up -d --wait"

[tasks.psql]
description = "コンテナ内の psql に入る(引数はそのまま psql へ渡る: mise run psql -- -c 'select 1')"
run = "docker compose exec db psql -U ec -d ec"

[tasks.api-run]
description = "APIサーバーを起動(:8080)"
dir = "api"
run = "mise exec -- go run ./cmd/api"

[tasks.sqlc]
description = "SQLから型付きGoコードを生成(api/internal/db/)"
dir = "api"
run = "mise exec -- sqlc generate"

[tasks.api-test]
description = "APIの統合テスト(実DBが必要: mise run up 済みであること)"
dir = "api"
run = "mise exec -- go test ./... -count=1 -v"

[tasks.mobile-install]
description = "mobile/ の依存をインストール(pnpm)"
dir = "mobile"
run = 'PATH="$EC_TOOL_PATH:$PATH" pnpm install'

[tasks.mobile-start]
description = "Expo 開発サーバーを起動(引数はそのまま expo start へ: mise run mobile-start -- --web)"
dir = "mobile"
run = 'PATH="$EC_TOOL_PATH:$PATH" pnpm start'

[tasks.mobile-prebuild]
description = "ネイティブプロジェクトを生成(CNG: ios/android は生成物で git 管理外)"
dir = "mobile"
run = 'PATH="$EC_TOOL_PATH:$PATH" pnpm run prebuild'

[tasks.mobile-ios]
description = "iOS をローカルビルドしてシミュレータで起動(development build。追加引数は expo run:ios へ: mise run mobile-ios -- --no-bundler)"
dir = "mobile"
# --device を固定する理由: 無指定だと「今 Booted のシミュレータ > Simulator.app の既定端末」の順で選ばれ、
# 別プロジェクトで iOS 18 以下の端末を開いていると Liquid Glass(iOS 26+)が出ないビルドがそこに入る。
# 端末名は環境変数で差し替え可(例: EC_IOS_DEVICE="iPhone 17" mise run mobile-ios)。
# 同名端末が複数ランタイムにある場合、expo は Booted 中のものを優先し、なければ simctl の並び順で最初のもの。
# 前提: ios/ が無ければ expo run:ios が prebuild を自動実行する(--clean はしないので、config 変更後は mobile-prebuild を先に)
# 前提: 起動は「exp+<app.json の slug>://expo-development-client/?url=<Metro>」のディープリンクで行われる
# (expo-dev-client/plugin の getDefaultScheme が slug から生成)。slug が他プロジェクトと同じだと LaunchServices が
# 別アプリ(例: workout-log の slug "mobile")にリンクを渡し、そのアプリが本プロジェクトの JS バンドルを読んで
# worklets の JS/ネイティブ不一致で SIGABRT する(2026-08-28 に実際に発生)。bundle id は別でも防げない。
# → slug と scheme を "eclearning" に固定。create-expo-app 既定の "mobile" に戻さないこと。
# 前提: 実機ビルド・Watch ターゲットに必要な Apple Team ID は mobile/.env.local の EC_APPLE_TEAM_ID から
# app.config.ts が注入する(Expo CLI が .env.local を自動で読むので mise の [env] には置かない)。
run = 'PATH="$EC_TOOL_PATH:$PATH" pnpm exec expo run:ios --device "${EC_IOS_DEVICE:-iPhone 17 Pro}"'

[tasks.mobile-check]
description = "mobile/ の型チェックと lint"
dir = "mobile"
run = 'PATH="$EC_TOOL_PATH:$PATH" pnpm run check'

[tasks.mobile-expo-check]
description = "mobile/ の依存が Expo SDK の期待する版か検証(SDK 連動の更新 PR で CI が走らせる。ずれていたら npx expo install --fix)"
dir = "mobile"
run = 'PATH="$EC_TOOL_PATH:$PATH" CI=1 pnpm exec expo install --check'

[tasks.renovate-dry-run]
description = "Renovate をローカルで dry-run し、検知した依存と提案を表で出す(PR は作らない。renovate.json5 を変えたらまずこれ)"
run = "scripts/renovate-dry-run.sh"
